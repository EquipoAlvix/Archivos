<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="login-card">

        <h2 class="text-center mb-4">bienvenido</h2>

        <form id="loginForm">

            <div class="mb-3">
                <label for="control" class="form-label">
                    Número de Control 
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="control"
                    name="control"
                    placeholder="Ingresa tu número de control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">
                Ingresar
            </button>

            <div class="registro text-center mt-3">
                <p>¿No tienes una cuenta?</p>

                <button
                    type="button"
                    class="btn btn-outline-success"
                    onclick="window.location.href='registro.html'"
                >
                    Crear Cuenta
                </button>
            </div>

        </form>

    </div>

    <script src="login.js"></script>

</body>
</html>
